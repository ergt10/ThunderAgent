      TRAINER_RESUME_MODE: "from_path"
      TRAINER_RESUME_PATH: "/data/zy/models/$USER/harbor_ckpts/r2egym-ta-mediumhard256-10epoch-nopf-20260328_081125/ckpts/global_step_16"
    unset_env:
      - "SKYRL_DISABLE_THUNDERAGENT"
  thunderagent_medium_hard_256_eval_only_step40_no_preflight:
    description: "Resume the ThunderAgent medium-hard train256/eval64 run from global_step_40, run the fixed eval at step 40, and exit without further training."
    env:
      RUN_NAME_OVERRIDE: "r2egym-ta-mediumhard256-evalonly-step40-nopf-$(date +%Y%m%d_%H%M%S)"
      THUNDERAGENT_WATCHDOG_ENABLED: "0"
      HARBOR_AGENT_MAX_TURNS: "25"
      TRAIN_DATA: "['/home/$USER/zthunder_yagent/data/harbor/r2egym-train256-medium-hard-v1']"
      EVAL_DATA: "['/home/$USER/zthunder_yagent/data/harbor/r2egym-eval64-medium-hard-v1']"
      MAX_TRAIN_TASKS: "256"
      MAX_EVAL_TASKS: "64"
      CKPT_ROOT_OVERRIDE: "/data/zy/models/$USER/harbor_ckpts"
      CKPT_INTERVAL: "-1"
      FULL_EPOCHS: "10"
      EVAL_INTERVAL_STEPS: "4"
      USE_KL_LOSS: "false"
      KL_LOSS_COEF: "0.0"
      TRAINER_RESUME_MODE: "from_path"
      TRAINER_RESUME_PATH: "/data/zy/models/$USER/harbor_ckpts/r2egym-ta-mediumhard256-10epoch-resume-step16-20260329_075603/ckpts/global_step_40"
      RUN_PREFLIGHT_CHECKS: "false"
      AGENT_RUNTIME_PREFLIGHT: "false"
      RUN_HARBOR_DOCKER_CONCURRENCY_SMOKE_PREPARE: "false"
    unset_env:
      - "SKYRL_DISABLE_THUNDERAGENT"

stages:
  - id: "prepare"
    run: "bash \"$WRAPPER\" prepare"
    runtime_probe_skill: null
    success_checks:
      - "command exits 0"
      - "required Harbor patching and validation complete"
  - id: "head"
    run: "bash \"$WRAPPER\" head"
    runtime_probe_skill: null
    success_checks:
      - "command exits 0"
      - "the selected Docker endpoint is ready on the merged/head node"
  - id: "ray"
    run: "bash \"$WRAPPER\" ray"
    runtime_probe_skill: null
    first_check_targets:
      - "bash \"$WRAPPER\" status"
      - "$LOG_DIR/launcher_ray.log"
    success_checks:
      - "command exits 0"
      - "Ray head and 4 trainer workers are reachable"
  - id: "rollout"
    run: "bash \"$WRAPPER\" rollout"
    runtime_probe_skill: null
    first_check_targets:
      - "bash \"$WRAPPER\" status"
      - "$LOG_DIR/launcher_rollout.log"
      - "$LOG_DIR/rollout/rollout_*.log"
    success_checks:
      - "command exits 0"
      - "ports 18000, 18001, 18002, 18003 are healthy"
  - id: "status"
    run: "bash \"$WRAPPER\" status"
    runtime_probe_skill: null
    success_checks:
      - "stage status is readable before driver launch"
  - id: "driver"
    run: "bash \"$WRAPPER\" driver"
    runtime_probe_skill: null
    first_check_targets:
      - "bash \"$WRAPPER\" status"
      - "$LOG_DIR/launcher_train_driver.log"
      - "$LOG_DIR/monitoring/trial_progress.tsv"
    success_checks:
      - "command exits 0 only after the driver reaches a terminal success state"
      - "use $LOG_DIR/monitoring/trial_progress.tsv as the progress truth for completed trials"

profiling_monitoring:
  log_root_template: "/home/hkang/zthunder_yagent/tmp_logs/$RUN_NAME_OVERRIDE"
  run_artifact_root_template: "/scratch/triton_cache/$USER/harbor_run_artifacts/$RUN_NAME_OVERRIDE"
  analysis_output_dir_template: "/home/hkang/zthunder_yagent/tmp_logs/$RUN_NAME_OVERRIDE/analysis"
  summary_output_dir_template: "/home/hkang/zthunder_yagent/tmp_logs/$RUN_NAME_OVERRIDE/post_run_summary"
  raw_signal_sources:
    rollout:
      - "/home/hkang/zthunder_yagent/tmp_logs/$RUN_NAME_OVERRIDE/rollout/monitoring/vllm_metrics.tsv"
      - "/home/hkang/zthunder_yagent/tmp_logs/$RUN_NAME_OVERRIDE/rollout/monitoring/gpu_summary.tsv"
    thunderagent:
      - "/home/hkang/zthunder_yagent/tmp_logs/$RUN_NAME_OVERRIDE/monitoring/thunderagent_backend_state.tsv"
      - "/home/hkang/zthunder_yagent/tmp_logs/$RUN_NAME_OVERRIDE/monitoring/thunderagent_program_state.tsv"
      - "/home/hkang/zthunder_yagent/tmp_logs/$RUN_NAME_OVERRIDE/monitoring/thunderagent_events.tsv"
      - "/home/hkang/zthunder_yagent/tmp_logs/$RUN_NAME_OVERRIDE/monitoring/trial_progress.tsv"
    training:
      - "/scratch/triton_cache/$USER/harbor_run_artifacts/$RUN_NAME_OVERRIDE/memory_events/*.jsonl"
      - "/home/hkang/zthunder_yagent/tmp_logs/$RUN_NAME_OVERRIDE/monitoring/async_trace.jsonl"
      - "/scratch/triton_cache/$USER/harbor_run_artifacts/$RUN_NAME_OVERRIDE/trials_run/**/result.json"
      - "/scratch/triton_cache/$USER/harbor_run_artifacts/$RUN_NAME_OVERRIDE/trials_run/**/agent/trajectory.json"
  required_post_run_outputs:
    rollout:
      - "rollout_prefix_cache_hit_rate.png"
      - "rollout_num_requests_running.png"
      - "rollout_num_requests_waiting.png"
      - "rollout_kv_usage.png"
      - "rollout_memory.png"
      - "rollout_kv_cache_summary.tsv"
    thunderagent:
      - "thunderagent_backend_tokens.png"
      - "thunderagent_program_counts.png"
      - "thunderagent_monitoring_report.md"
    training:
      - "trainer_memory.png"
      - "timeline_overview.png"
      - "timeline_report.md"
      - "trial_step_timing_breakdown.png"
      - "trial_step_timing_heatmap.png"
      - "trial_step_timing_report.md"
      - "trial_stage_breakdown.png"
      - "trial_stage_breakdown_report.md"
  post_run_analysis:
    setup:
      - "export LOG_DIR=\"/home/hkang/zthunder_yagent/tmp_logs/$RUN_NAME_OVERRIDE\""
      - "export RUN_ARTIFACT_DIR=\"/scratch/triton_cache/$USER/harbor_run_artifacts/$RUN_NAME_OVERRIDE\""
      - "export ANALYSIS_DIR=\"$LOG_DIR/analysis\""
      - "export SUMMARY_DIR=\"$LOG_DIR/post_run_summary\""
      - "mkdir -p \"$ANALYSIS_DIR\" \"$SUMMARY_DIR\""
    commands:
      - "\"$REPO_ROOT/.venv/bin/python\" \"$REPO_ROOT/examples/train_integrations/harbor/analysis/scripts/summarize_qwen3_32b_full_run.py\" --run-name \"$RUN_NAME_OVERRIDE\" --log-dir \"$LOG_DIR\" --trainer-monitor-root \"$LOG_DIR/trainer_monitors\" --rollout-monitor-dir \"$LOG_DIR/rollout/monitoring\" --tensorboard-dir \"$LOG_DIR/tensorboard\" --async-trace \"$LOG_DIR/monitoring/async_trace.jsonl\" --output-dir \"$SUMMARY_DIR\" --python-bin \"$REPO_ROOT/.venv/bin/python\""
      - "\"$REPO_ROOT/.venv/bin/python\" \"$REPO_ROOT/examples/train_integrations/harbor/analysis/scripts/analyze_thunderagent_monitoring.py\" --log-dir \"$LOG_DIR\" --output-dir \"$ANALYSIS_DIR\""
      - "\"$REPO_ROOT/.venv/bin/python\" \"$REPO_ROOT/examples/train_integrations/harbor/analysis/scripts/analyze_qwen3_full_run_timeline.py\" --run-name \"$RUN_NAME_OVERRIDE\" --log-root \"/home/hkang/zthunder_yagent/tmp_logs\" --output-dir \"$ANALYSIS_DIR\""
      - "\"$REPO_ROOT/.venv/bin/python\" \"$REPO_ROOT/examples/train_integrations/harbor/analysis/scripts/analyze_harbor_step_timing.py\" --run-dir \"$RUN_ARTIFACT_DIR\" --output-dir \"$ANALYSIS_DIR\" --max-steps 50"
      - "\"$REPO_ROOT/.venv/bin/python\" \"$REPO_ROOT/examples/train_integrations/harbor/analysis/scripts/analyze_harbor_trial_stage_breakdown.py\" --run-artifacts-dir \"$RUN_ARTIFACT_DIR\" --output-dir \"$ANALYSIS_DIR\""
    mapping:
      rollout_kv_cache_hit_rate_per_engine:
        script: "analyze_qwen3_full_run_timeline.py"
        outputs:
          - "rollout_prefix_cache_hit_rate.png"
          - "timeline_report.md"
      rollout_num_running_waiting_per_engine:
        script: "analyze_qwen3_full_run_timeline.py"
        outputs:
          - "rollout_num_requests_running.png"
          - "rollout_num_requests_waiting.png"
          - "timeline_report.md"
      thunderagent_metric_timelines:
        script: "analyze_thunderagent_monitoring.py"
        outputs:
          - "thunderagent_backend_tokens.png"
          - "thunderagent_program_counts.png"
          - "thunderagent_monitoring_report.md"
      trainer_memory_timeline:
        script: "analyze_qwen3_full_run_timeline.py"
        outputs:
          - "trainer_memory.png"
          - "timeline_report.md"
      training_part_timing:
        script: "analyze_harbor_step_timing.py"
        outputs:
          - "trial_step_timing_breakdown.png"
          - "trial_step_timing_heatmap.png"
          - "trial_step_timing_report.md"
      trial_stage_timing:
        script: "analyze_harbor_trial_stage_breakdown.py"
        outputs:
          - "trial_stage_breakdown.png"
          - "trial_stage_breakdown_report.md"
  caveats:
    - "The current cross-job wrapper does not automatically run the post-run analysis commands above; run them explicitly after each baseline or ThunderAgent capture."
    - "The current cross-job wrapper does not yet start per-trainer-node gpu_summary collection across multiple job IDs, so trainer node monitor summaries may be missing even though run-level trainer memory timelines from RUN_ARTIFACT_DIR/memory_events should still exist."
    - "ThunderAgent-specific plots are only expected to be meaningful for the ThunderAgent-enabled treatment."
    - "When invoking prepare/head/ray/rollout/driver as separate commands, pin RUN_TS and RUN_SHORT_ID once per run and clear inherited XDG_RUNTIME_DIR/DOCKER_* so the wrapper uses one scratch-scoped rootless runtime. Otherwise head can collide with /run/user/$UID/dockerd-rootless and later stages may look at a different Docker socket/path set."

recovery:
  rollout_only:
    - "bash \"$WRAPPER\" cleanup-stage rollout"
    - "bash \"$WRAPPER\" rollout"
  driver_only:
    - "bash \"$WRAPPER\" cleanup-stage driver"
    - "bash \"$WRAPPER\" driver"
  driver_preflight_only:
    - "bash \"$WRAPPER\" driver-preflight"
  full_stack_owned_by_wrapper:
    - "bash \"$WRAPPER\" cleanup-stage all"
  forbidden:
    - "Do not cancel parent Slurm jobs as part of routine recovery."
    - "Do not use wrapper action all for benchmark launches."
    - "Do not use wrapper action driver-detach for benchmark launches."

comparison_checklist:
  - "Both runs used the same allocation shape."
  - "Both runs used the same model path and dataset specs."
  - "Both runs used the same MAX_TRAIN_TASKS and timeout settings."
  - "Both runs reached rollout health on the same port set."
  - "The only intended semantic difference was SKYRL_DISABLE_THUNDERAGENT."
  - "The compared timing comes from the same stage of the run."

update_policy:
  update_when:
    - "wrapper interface changes"
    - "required env vars change"
    - "recovery commands change"
    - "benchmark-shape settings that affect fairness change"
  do_not_put_here:
    - "historical run notes"
    - "free-form replay diary"
