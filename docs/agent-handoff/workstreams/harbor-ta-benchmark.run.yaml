version: 1
kind: "benchmark_run_spec"

meta:
  name: "harbor-ta-benchmark"
  objective: "compare_no_ta_vs_ta_1step_wall_clock"
  primary_metric: "train_step_wall_clock"
  owner: "hkang + agents"
  repo_root: "/home/hkang/zthunder_yagent/SkyRL"
  source_of_truth:
    execution_wrapper: "/home/hkang/zthunder_yagent/SkyRL/examples/train_integrations/harbor/run_r2egym_qwen3_32b_5node_rootless_full_1step_miniswe50_timeout9000_fd131072_cross_job_merged_head_rollout.sh"
    ta_runtime_handoff: "/home/hkang/zthunder_yagent/SkyRL/examples/train_integrations/harbor/docs/runbooks/R2EGYM_QWEN3_32B_6NODE_1STEP_TA_RUNTIME_FULL_HANDOFF.md"
    no_ta_reference_wrapper: "/home/hkang/zthunder_yagent/SkyRL/examples/train_integrations/harbor/run_r2egym_qwen3_32b_6node_rootless_full_1step_miniswe50_timeout9000_fd131072_blockdockerd_replay_no_thunderagent_nockpt.sh"
  notes:
    - "Use the custom cross-job wrapper as the execution layer for both baseline and treatment on the current cluster shape."
    - "The intended benchmark delta is whether ThunderAgent is enabled, not a different workload or topology."
    - "The current canonical benchmark uses system Docker on the merged/head node via DOCKER_MODE=rootful; rootless lifecycle remains wrapper-supported but is not the benchmark default."
    - "The only allowed Codex launch path is cleanup-stage all -> prepare -> head -> ray -> rollout -> status -> driver."
    - "The canonical wrapper action bash \"$WRAPPER\" driver is durable: it launches a detached local srun client internally and blocks on explicit terminal-state detection."
    - "Do not use wrapper action all or driver-detach for benchmark launches."
    - "Strict path means every executed launch or recovery command must be copied verbatim from bootstrap.commands, variants, stages[*].run, or recovery below."
    - "Runtime probe skills are disabled for this workstream; use wrapper status and the named logs/TSVs below."
    - "3-step timing captures must use a dedicated variant that sets FULL_EPOCHS=3 and disables preflight helpers, rather than ad-hoc shell overrides."
    - "Long-run curated-subset experiments must use a dedicated variant that sets TRAIN_DATA, EVAL_DATA, MAX_TRAIN_TASKS, MAX_EVAL_TASKS, FULL_EPOCHS, and EVAL_INTERVAL_STEPS together."

invariants:
  - "never_scancel_parent_jobs"
  - "recover_by_stage_not_full_restart"
  - "keep_baseline_and_treatment_fair"
  - "do_not_silently_change_benchmark_contract"
  - "literal_commands_only_from_run_spec_and_wrapper"
  - "runtime_probe_skills_disabled_for_ray_rollout_driver"

